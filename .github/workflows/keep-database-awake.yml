# Supabase pauses free projects after 7 days without activity.
# This runs twice a week and makes one small read, so the database stays awake. It costs nothing.
name: Keep database awake
on:
  schedule:
    - cron: "17 3 * * 1,4"   # Mondays and Thursdays, 03:17 UTC
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the public connection settings from config.js and ping the database
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' config.js || true)
          KEY=$(grep -oP 'supabaseAnonKey:\s*"\K[^"]+' config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Database not configured yet; nothing to do."; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/conferences?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Database answered with HTTP $code"
          test "$code" = "200"
